{% set name = "gensim" %}
{% set version = "4.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/RaRe-Technologies/{{ name }}/archive/refs/tags/{{ version }}.tar.gz
  sha256: 0c1c8984f18512aba04332b45dc58698ac277dfa1d314a190a3f07edc48c31ac

build:
  number: 0
  skip: true  # [py<39]
  script: {{ PYTHON }} -m pip install --no-deps --no-build-isolation . -vv

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}
  host:
    - python
    - pip
    - cython >=3.1.3
    # Using numpy 2 for runtime compatibility with both 1 and 2
    - numpy >=2
    - setuptools
    - wheel
    - scipy
  run:
    - python
    - numpy >=1.18.5
    - scipy >=1.7.0
    - smart_open >=1.8.1
  run_constrained:
    - Pyro4 >=4.27

test:
  imports:
    - gensim
    - gensim.corpora
    - gensim.models
    - gensim.parsing
    - gensim.scripts
    - gensim.similarities
    - gensim.test
    - gensim.topic_coherence
  requires:
    - pip
    - pytest
    - testfixtures
  source_files:
    - gensim/test
  commands:
    - pip check
    # test_distance - numerical instability np.float32(1.1920929e-07) != 0
    # test_parallel - race conditions
    # test_persistence_separate_file - random access denied
    - pytest -v gensim/test -k "not (test_distance or test_parallel or test_persistence_separate_file)"

about:
  home: https://github.com/RaRe-Technologies/gensim
  license: LGPL-2.1-only
  license_family: LGPL
  license_file: COPYING
  summary: Topic Modelling for Humans
  description: |
    Gensim is a Python library for topic modelling, document indexing
    and similarity retrieval with large corpora.
    Target audience is the natural language processing (NLP)
    and information retrieval (IR) community.
  doc_url: https://radimrehurek.com/gensim/
  dev_url: https://github.com/RaRe-Technologies/gensim

extra:
  recipe-maintainers:
    - souravsingh
    - mpenkov
